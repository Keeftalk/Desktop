name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-audit:
    name: Format, Clippy & Secret Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsecret-1-dev libwayland-dev libxkbcommon-dev
      - name: Check for accidental secrets
        run: |
          if git grep -nE "SUPABASE_SERVICE_ROLE_KEY=ey|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY" -- ':!.github/workflows/ci.yml' ':!.env.example' ':!docs/'; then
            echo "Potential secret detected!"
            exit 1
          fi

  test-and-build:
    name: Build & Test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: keeftalk-desktop-linux-x86_64
            binary_path: target/x86_64-unknown-linux-gnu/release/keeftalk-desktop
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: keeftalk-desktop-windows-x86_64.exe
            binary_path: target/x86_64-pc-windows-msvc/release/keeftalk-desktop.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: keeftalk-desktop-macos-aarch64
            binary_path: target/aarch64-apple-darwin/release/keeftalk-desktop
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: keeftalk-desktop-macos-x86_64
            binary_path: target/x86_64-apple-darwin/release/keeftalk-desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsecret-1-dev libwayland-dev libxkbcommon-dev
      - name: Build Release Executable
        run: cargo build --release -p keeftalk-app --target ${{ matrix.target }}
      - name: Run workspace tests in release mode
        run: cargo test --release --workspace --target ${{ matrix.target }}
      - name: Smoke check mock mode
        run: cargo run --release -p keeftalk-app --target ${{ matrix.target }} -- --mode mock --headless-check
      - name: Upload Desktop Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error
