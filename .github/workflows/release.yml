name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: keeftalk-desktop-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: keeftalk-desktop-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: keeftalk-desktop-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsecret-1-dev libwayland-dev libxkbcommon-dev
      - name: Build release binary
        run: cargo build --release -p keeftalk-app --target ${{ matrix.target }}
      - name: Package Unix archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/keeftalk-desktop dist/
          tar -czf ${{ matrix.asset_name }} -C dist keeftalk-desktop
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/keeftalk-desktop.exe dist/
          Compress-Archive -Path dist/keeftalk-desktop.exe -DestinationPath ${{ matrix.asset_name }}
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
